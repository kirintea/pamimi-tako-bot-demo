# 渠道管理设置（行为开关）
#
# 区别于 configs/channels.json —— 那里管「渠道实例清单」（连哪个 bot、白名单等），
# 这里管渠道的全局行为开关。
#
# 修改后无需重启：ChannelManager 在触发点按文件 mtime 惰性热重载
# （新会话推送是低频事件，下次触发即生效）。
# 也支持环境变量占位：push_session_id: ${CHANNEL_PUSH_SESSION_ID:-true}

# 会话 ID 推送 —— 新会话创建时，是否向渠道聊天输出：
#   「本次对话会话ID: … / 可用于查询对话历史。」
#   true  = 输出（默认，与旧行为一致）
#   false = 不输出。此时：
#           - 首次创建会话：不再发任何提示
#           - 空闲自动轮换：仍发「✅ 已自动开启新会话…」确认语，但不含会话 ID
#           - /new 等指令回执不受影响（其文案本身不含会话 ID）
push_session_id: false
