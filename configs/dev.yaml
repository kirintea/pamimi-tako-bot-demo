# 开发环境配置
# 通过 APP_ENV=dev 加载 (默认)

# OpenTelemetry 追踪（可选，开发默认关闭）
# endpoint: OTLP gRPC 上报地址（Jaeger / OTEL Collector）
# channel:  消息渠道 Resource tag，多渠道部署时按实例区分（web / feishu / wechat）
otel:
  enabled: true
  endpoint: "${OTEL_ENDPOINT:-http://localhost:4317}"
  service_name: "platform-agent"
  service_version: "0.1.0"
  environment: "development"
  channel: "${OTEL_CHANNEL:-web}"
  headers: {}

# LLM 模型配置（* 必填 api_key / base_url / model）
# provider:  openai（兼容接口）/ dashscope 
# stream:    是否默认流式输出
# timeout:   调用超时（秒），流式模式下为空闲无事件超时
llm:
  provider: "openai"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL}"
  model: "${LLM_MODEL_NAME:-qwen-max}"
  stream: true
  context_size: 128000
  max_tokens: 4096
  temperature: 0.7

# API 认证（开发默认关闭；生产必须 required: true）
# required: true 时，HTTP Header 需携带 Authorization: Bearer <api_key>
# 代码中也可通过 AUTH_REQUIRED=true 环境变量强制开启
auth:
  required: false
  api_key: "${API_KEY:-}"

server:
  host: "0.0.0.0"
  port: 8090
  workers: 1
  log_level: "DEBUG"
  log_dir: "logs"
  log_backup_count: 7

agent:
  name: "platform_agent"
  # 系统提示词（从 configs/prompt.py 加载，修改提示词编辑该文件即可）
  system_prompt:
    module_path: "configs.prompt"
    name: "SYSTEM_PROMPT"
  max_iters: 50
  # trigger_ratio: 压缩触发阈值，默认 0.6（~76K tokens 时触发）。
  # 生产环境可调至 0.5 进一步提前触发，减少单次请求 token 消耗。
  context_trigger_ratio: 0.6
  # reserve_ratio: 压缩后保留近期上下文比例，0.15 保留 ~19K tokens
  context_reserve_ratio: 0.15
  # tool_result_limit: 单条工具结果 token 上限，50000→15000 防止单次工具调用占满上下文
  tool_result_limit: 15000
  # reply_token_budget: 单次回复加权 token 预算，超限自动收尾
  reply_token_budget: 80000
  # 运行时注入配置
  injection:
    timezone: "Asia/Shanghai"
    time_interval: 0.5                    # 每 30 分钟刷新时间
    context_buffer_ratio: 0.15            # 压缩阈值前 15% 开始预警
    emit_hint_event: true                 # 前端可渲染注入内容
    extra_fields:
      platform: "AgentScope Platform Server"

  permission_mode: "bypass"
  # 沙箱配置（双域布局：agent_space/ 共享只读 + user_spaces/{user_id}/ 私有可读写）
  sandbox_dir: "workspaces"
  # root 预置：命中者角色为 root，可写 agent_space 并只读查看他人会话。
  # 也可用环境变量 ROOT_USER_IDS（逗号分隔）追加，环境变量优先于此处。
  root_user_ids:
    - "root"
  sandbox_skills: true       # true 时 skills 从 agent_space/skills/ 加载（双域共享只读域）
  sandbox_mcp: false         # true 时 MCP 配置从 agent_space/mcp/ 加载
  sandbox_per_user: true    # true 时沙箱路径追加 user_id 层级（user_spaces/{user_id}/）
  tool_guard:
    enabled: false
    mode: "allowlist" # allowlist | blocklist
    tools: ["Skill"]

  command_guard:
    enabled: true
    mode: "blocklist"           # allowlist | blocklist
    rules:
      - "rm -rf /"              # 拦截删根目录
      - "rm -rf ~"              # 拦截删 home
      - "rm -rf /*"             # 拦截删根目录通配
      - "*|*bash*"              # 拦截管道执行 shell
      - "*|*sh*"                # 拦截管道执行 sh
      - "*/dev/tcp/*"           # 拦截 Bash 反弹 shell
      - "Invoke-Expression*"    # 拦截 PowerShell 远程执行
      - "certutil*"             # 拦截 Windows 下载
      - "curl *|*"              # 拦截 curl 管道 (curl 下载可以，管道不行)

  # 工具管理器 — 从 configs/tools.yaml 选择性加载工具
  tool_manager:
    config_path: "configs/tools.yaml"

# MCP 服务不在 YAML 中配置 —— 唯一真源是 configs/mcps.json
# （前端 /webui 或 REST /mcp 管理，保存即热加载，新建会话生效）
# 注意：AppConfig 为 extra="forbid"，此处写 mcp_servers 会直接启动失败。

database:
  # ------------------------------------------------------------
  # 数据库（PostgreSQL / MySQL 二选一，backend=auto 按 URL scheme 推断）
  #   auto_create_tables: 启动时自动执行幂等 DDL 建表
  #   verify_tables:      建表/连接后校验必需表齐全（禁用 DDL 时尤其重要）
  #   初始化失败固定 fail-fast：ERROR 日志（根因/缺表清单）→ 抛出 → 进程启动失败退出
  # 注意：url 默认值为本地开发凭据，仅用于 localhost。
  # 真实部署（尤其是生产环境）必须显式设置 DATABASE_URL 环境变量，
  # 切勿使用默认账号/密码直连数据库。
  # ------------------------------------------------------------
  backend: "auto"
  url: "${DATABASE_URL:-postgresql://user:password@localhost:5432/dmx_agent_db}"
  pool_size: 10
  auto_create_tables: true
  verify_tables: true

redis:
  url: "${REDIS_URL:-redis://localhost:6379/0}"
  key_prefix: "agentscope:session:"
  session_ttl: 1800

# KV 存储（会话状态 / 元数据持久化层）
#   redis — 默认，与消息总线共用 Redis（多实例 / 生产）
#   jsonl — 开发/资源受限：本地 JSONL 文件（workspaces/.history/kv_data/kv.jsonl），单进程，无 Redis 依赖
kv:
  backend: "${KV_BACKEND:-redis}"            # redis / jsonl（可用环境变量临时切换）
  jsonl_path: "${KV_JSONL_PATH:-workspaces/.history/kv_data}"
  jsonl_compact_threshold: 5000              # 追加行数达到阈值时压缩重写

# 上下文回填配置
# 当会话从 PG 恢复到 Redis 时（用户重连 / 跨实例迁移），
# 控制回填多少条历史消息和 token 预算，避免一次性加载过多。
context:
  backfill_message_limit: 20        # 回填消息条数上限
  backfill_token_budget: 15000      # 回填 token 预算

# 中间件配置
# budget_control: 回复预算控制 — 单次回复加权 token 超限时自动收尾
#   input_weight / output_weight: 加权公式 = input*weight + output*weight
# rate_limit: 速率限制（默认 10 req/min per-user，未配置则使用 schema 默认值）
middleware:
  budget_control:
    enabled: true
    token_budget: 80000             # 单次回复加权 token 预算
    input_weight: 1
    output_weight: 2                # 输出 token 成本更高
  # rate_limit:
  #   enabled: true
  #   requests_per_minute: 10

# 沙箱配置
# backend: "local" = 直接本机执行（默认），"docker" = 转发到沙箱容器
# 设为 "docker" 前需先启动沙箱容器：
#   docker compose -f docker-compose.sandbox.yml up -d sandbox
sandbox:
  # backend: "${SANDBOX_BACKEND:-local}"
  backend: "docker"
  container: "platform-sandbox"
  project_root: "/workspace"
  # 额外挂载（宿主机路径 → 容器内路径）
  # ⚠ host 路径需与 agent.sandbox_skills 的实际加载路径一致：
  #   sandbox_skills=false 时 → host: "skills"（项目根，当前配置）
  #   sandbox_skills=true + per_user=true 时 → 需按 user_id 动态挂载
  extra_mounts:
    # 双域防御纵深：仅将 agent_space 以只读方式挂入容器，
    # 防止容器内 Bash/Python 工具越权改写 Agent 共享资产。
    # 用户私有域 user_spaces/{user_id} 由 DockerSandboxProxy 按会话动态挂载（读写）。
    - host: "workspaces/agent_space"
      container: "/workspace/agent_space"
      readonly: true

# 对象存储配置（图片上传等；S3/OSS 环境变量见 .env.example 第 9 节）
object_storage:
  backend: "local"              # local / s3 / aliyun_oss
  # 本地存储落入用户私有域：key 布局 {user_id}/uploads/{date}/{uuid}.ext
  # → 实际磁盘 workspaces/user_spaces/{user_id}/uploads/...
  prefix: "uploads/"            # 对象 key 前缀（位于 user_id 之后）
  local_dir: "workspaces/user_spaces"  # 本地存储根（backend=local），与双域用户域一致

  # backend=s3 时生效（AWS S3 / MinIO / Cloudflare R2）
  # s3_endpoint: "${S3_ENDPOINT:-http://localhost:9000}"
  # s3_access_key: "${S3_ACCESS_KEY:-minioadmin}"
  # s3_secret_key: "${S3_SECRET_KEY:-minioadmin}"
  # s3_bucket: "${S3_BUCKET:-agentscope-images}"
  # s3_region: "${S3_REGION:-us-east-1}"
  # s3_addressing_style: "path"   # MinIO 用 "path"，AWS S3 用 "virtual"

  # backend=aliyun_oss 时生效
  # oss_endpoint: "${OSS_ENDPOINT:-https://oss-cn-hangzhou.aliyuncs.com}"
  # oss_access_key: "${OSS_ACCESS_KEY:-}"
  # oss_secret_key: "${OSS_SECRET_KEY:-}"
  # oss_bucket: "${OSS_BUCKET:-agentscope-images}"

# 图片输入配置
image:
  enabled: true
  max_size_mb: 10               # 单张图片最大 MB
  max_count_per_msg: 5          # 单条消息最多图片数
  allowed_types:                # 允许的 MIME 类型
    - "image/png"
    - "image/jpeg"
    - "image/gif"
    - "image/webp"
  presigned_url_ttl: 300        # Presigned URL 有效期（秒）
