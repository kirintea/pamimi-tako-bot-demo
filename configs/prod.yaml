# 生产环境配置
# 通过 APP_ENV=prod 加载

otel:
  enabled: true
  endpoint: "http://otel-collector.prod.svc:4317"
  service_name: "platform-agent"
  service_version: "0.1.0"
  environment: "production"
  channel: "${OTEL_CHANNEL:-web}"
  headers:
    authorization: "Bearer ${OTEL_TOKEN}"

llm:
  provider: "openai"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL}"
  model: "${LLM_MODEL_NAME}"
  stream: true
  context_size: 128000
  max_tokens: 4096
  temperature: 0.7

auth:
  required: true
  api_key: "${API_KEY:-}"

server:
  host: "0.0.0.0"
  port: 9090
  workers: 0
  log_level: "INFO"
  log_dir: "logs"
  log_backup_count: 30

agent:
  name: "platform_agent"
  system_prompt:
    module_path: "configs.prompt"
    name: "SYSTEM_PROMPT"
  max_iters: 50
  context_trigger_ratio: 0.8
  context_reserve_ratio: 0.1
  permission_mode: "auto"
  # 沙箱配置（三个均启用时：workspaces/{user_id}/ + 独立 skills/ + 独立 mcp/）
  sandbox_dir: "workspaces"
  sandbox_skills: false      # true 时 skills 从 sandbox_dir/skills/ 加载
  sandbox_mcp: false         # true 时 MCP 配置从 sandbox_dir/mcp/ 加载
  sandbox_per_user: true    # true 时沙箱路径追加 user_id 层级（workspaces/{user_id}/）
  # tool_guard 的匹配规则为已知有缺陷的实现，可能在生产环境产生误判或漏拦，
  # 故在此显式禁用，命令安全过滤以 command_guard 为准（见下）。
  tool_guard:
    enabled: false
    mode: "blocklist"
    tools:
      - "Bash:rm -rf *"

  # 命令内容级安全守卫：生产环境必须开启，防止危险命令执行
  command_guard:
    enabled: true
    mode: "blocklist"           # allowlist | blocklist
    rules:
      - "rm -rf /"              # 拦截删根目录
      - "rm -rf ~"              # 拦截删 home
      - "rm -rf /*"             # 拦截删根目录通配
      - "*|*bash*"              # 拦截管道执行 shell
      - "*|*sh*"                # 拦截管道执行 sh
      - "*/dev/tcp/*"           # 拦截 Bash 反弹 shell
      - "Invoke-Expression*"    # 拦截 PowerShell 远程执行
      - "certutil*"             # 拦截 Windows 下载
      - "curl *|*"              # 拦截 curl 管道 (curl 下载可以，管道不行)

mcp_servers: []

database:
  # ------------------------------------------------------------
  # 生产数据库（权限受限账号场景：DBA 预先建表，应用账号按最小权限分配）
  #   应用账号仅需：7 张必需表的 SELECT/INSERT/UPDATE/DELETE + 连接权限（无 DDL 权限）
  #   auto_create_tables: false — 不执行 DDL，连接已有库
  #   verify_tables:      true  — 启动即校验 7 张必需表（读 information_schema，
  #                        所有账号可读），缺表即启动失败
  #                        （fail-fast，报错列出缺表清单 → DBA 建表后重启）
  # ------------------------------------------------------------
  backend: "auto"
  url: "${DATABASE_URL:-}"
  pool_size: 20
  auto_create_tables: false
  verify_tables: true

redis:
  url: "${REDIS_URL:-redis://localhost:6379/0}"

# KV 存储 — 生产固定 redis（多实例共享）；jsonl 仅限开发单进程场景，勿在生产使用
kv:
  backend: "redis"

# 沙箱配置
sandbox:
  backend: "${SANDBOX_BACKEND:-local}"
  container: "platform-sandbox"
  project_root: "/workspace"
  fallback_to_local: false
  extra_mounts:
    - host: "skills"
      container: "/workspace/skills"
      readonly: true
