# docker-compose.otel.yaml
# 本地可观测性调试栈：OTel Collector + Jaeger + Prometheus + Loki + Grafana
# 启动: cd docker; docker-compose -f docker-compose.otel.yaml up -d
# 停止: cd docker; docker-compose -f docker-compose.otel.yaml down

version: "2.2"

services:
  # ============================================================
  # 1. OTel Collector - 数据接收与分发
  # ============================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector-dev
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-dev.yaml:/etc/otelcol/config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC (Agent 上报)
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter
    depends_on:
      - jaeger
      - prometheus
      - loki
    networks:
      - otel-network

  # ============================================================
  # 2. Jaeger - Trace 存储 + UI (内存模式，仅本地调试)
  # ============================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger-dev
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317"          # 内部 OTLP gRPC (Collector → Jaeger)
    networks:
      - otel-network

  # ============================================================
  # 3. Prometheus - Metrics 指标存储
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - otel-network

  # ============================================================
  # 4. Loki - Logs 日志聚合
  # ============================================================
  loki:
    image: grafana/loki:latest
    container_name: loki-dev
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml
    networks:
      - otel-network

  # ============================================================
  # 5. Grafana - 统一可视化大盘
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-dev
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - jaeger
      - prometheus
      - loki
    networks:
      - otel-network

networks:
  otel-network:
    driver: bridge