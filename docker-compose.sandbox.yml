# docker-compose.sandbox.yml — 应用 + 沙箱分离部署
# 沙箱容器只挂载 workspaces/，不暴露项目源码和配置
#
# 启动:       docker compose -f docker-compose.sandbox.yml up -d
# 停止:       docker compose -f docker-compose.sandbox.yml down
# 进入 app:   docker compose -f docker-compose.sandbox.yml exec app bash
# 进入沙箱:   docker compose -f docker-compose.sandbox.yml exec sandbox bash
# 启动服务:   docker compose -f docker-compose.sandbox.yml exec app python main.py
# 重建镜像:   docker compose -f docker-compose.sandbox.yml build

x-app-image: &app-image
  image: pamimi-tako-bot-demo:0.2.1

x-sandbox-image: &sandbox-image
  image: pamimi-tako-bot-demo-sandbox:0.2.1

services:
  # ============================================================
  # 应用服务 — API 服务，拥有完整项目代码
  # ============================================================
  app:
    <<: *app-image
    container_name: pamimi-tako-bot-demo
    command: ["sleep", "infinity"]
    ports:
      - "8090:8090"
    volumes:
      # 代码外挂 — 完整项目
      - .:/workspace
      # 挂载 Docker Socket — 让 app 容器能管理 sandbox 容器
      - /var/run/docker.sock:/var/run/docker.sock
    stdin_open: true
    tty: true
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - REDIS_URL=redis://host.docker.internal:6390/0
      - DATABASE_URL=postgresql://user:password@host.docker.internal:5432/dmx_agent_db
      - OTEL_ENDPOINT=http://host.docker.internal:4317
      # 沙箱容器名（DockerSandboxProxy 用此名称连接沙箱）
      - SANDBOX_CONTAINER=pamimi-tako-bot-demo-sandbox
      # 沙箱模式: local（默认，不启用容器沙箱）/ docker（启用）
      - SANDBOX_BACKEND=${SANDBOX_BACKEND:-local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - sandbox
    restart: unless-stopped
    networks:
      - platform-net

  # ============================================================
  # 沙箱容器 — 只暴露 workspaces/，不可见项目源码和配置
  # ============================================================
  sandbox:
    <<: *sandbox-image
    container_name: pamimi-tako-bot-demo-sandbox
    volumes:
      # 绑定挂载宿主机 workspaces/，与 app 容器共享同一目录
      - ./workspaces:/workspace/workspaces
      # 双域防御纵深：agent_space 以只读挂入沙箱，
      # 防止容器内 Bash/Python 工具越权改写 Agent 共享资产
      # （PathGuard 是主机侧权威边界；此处为容器侧纵深防御，见方案 §4.1）
      - ./workspaces/agent_space:/workspace/workspaces/agent_space:ro
    stdin_open: true
    tty: true
    environment:
      - APP_ENV=${APP_ENV:-dev}
    working_dir: /workspace/workspaces
    # 保持容器运行
    command: ["sleep", "infinity"]
    restart: unless-stopped
    networks:
      - pamimi-tako-bot-demo-net

networks:
  pamimi-tako-bot-demo-net:
    driver: bridge
